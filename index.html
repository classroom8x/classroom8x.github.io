<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernwood Journal — Field notes on a slower life</title>
<meta name="description" content="Field notes on plants, kitchens, and a slower kind of living.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#eef1e4;
    --card:#fdfaf1;
    --forest:#16281c;
    --forest-soft:#223a2b;
    --moss:#5c7d4f;
    --moss-light:#a9c08f;
    --amber:#c98a4b;
    --ink:#20291f;
    --ink-soft:#5f6c58;
    --line:#d3d9c3;
    --radius:4px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'DM Sans', -apple-system, sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;margin:0;padding:0;}
  img{max-width:100%;display:block;}
  button{font:inherit;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .display{font-family:'DM Serif Display', serif; font-weight:400;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:14px;
    padding:16px 24px;
    background:var(--paper);
    border-bottom:1px solid var(--forest);
  }
  .topbar-left{display:flex; align-items:center; gap:12px;}

  .badge-toggle{
    width:40px;height:40px;
    border-radius:50%;
    background:var(--forest);
    border:none;
    cursor:pointer;
    position:relative;
    flex:none;
  }
  .badge-toggle span{
    position:absolute;
    left:50%;top:50%;
    width:14px;height:2px;
    background:var(--paper);
    transform:translate(-50%,-50%);
    transition:transform .22s ease, opacity .22s ease;
  }
  .badge-toggle span:first-child{transform:translate(-50%,-50%) translateY(-3px);}
  .badge-toggle span:last-child{transform:translate(-50%,-50%) translateY(3px);}
  .badge-toggle.active span:first-child{transform:translate(-50%,-50%) rotate(45deg);}
  .badge-toggle.active span:last-child{transform:translate(-50%,-50%) rotate(-45deg);}

  .brand{display:flex; align-items:center; gap:10px;}
  .monogram{
    width:38px;height:38px;
    border-radius:50%;
    border:1.5px solid var(--forest);
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Serif Display', serif;
    font-size:1.05rem;
    color:var(--forest);
    flex:none;
  }
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-text .site-name{
    font-size:1.2rem;
    color:var(--forest);
    white-space:nowrap;
  }
  .brand-text .tagline{
    font-size:0.68rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .topbar-center{
    justify-self:center;
    display:none;
  }
  @media (min-width:720px){
    .topbar-center{ display:block; }
  }
  .topbar-center .site-name{
    font-size:1.05rem;
    color:var(--forest);
  }

  .topbar-right{
    justify-self:end;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search-toggle{
    width:38px;height:38px;
    border-radius:50%;
    border:1.5px solid var(--forest);
    background:transparent;
    color:var(--forest);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .search-toggle svg{width:16px;height:16px;}
  .search-field{
    width:0;
    overflow:hidden;
    transition:width .22s ease;
  }
  .search-field.open{width:190px;}
  #searchInput{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--forest);
    background:transparent;
    padding:6px 2px;
    font-size:0.9rem;
    color:var(--ink);
    outline:none;
    font-family:'DM Sans', sans-serif;
  }

  /* ---------- Drawer ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,32,22,0.35);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:45;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .drawer{
    position:fixed; top:0; left:0;
    height:100%; width:280px;
    background:var(--forest);
    color:var(--paper);
    transform:translateX(-100%);
    transition:transform .28s ease;
    z-index:50;
    display:flex;
    flex-direction:column;
  }
  .drawer.open{transform:translateX(0);}

  .drawer-head{
    padding:22px 24px 16px;
    border-bottom:1px solid var(--forest-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .drawer-head .display{ font-size:1.15rem; color:var(--moss-light);}
  .drawer-close{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--forest-soft);
    background:transparent;
    color:var(--paper);
    cursor:pointer;
  }

  .drawer-nav{
    padding:18px 10px;
    overflow-y:auto;
    flex:1;
  }
  .drawer-nav .label{
    font-size:0.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--moss-light);
    padding:10px 14px 6px;
  }
  .drawer-nav a{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 14px;
    border-radius:3px;
    font-size:0.93rem;
    color:var(--paper);
    transition:background .15s ease, padding-left .15s ease;
  }
  .drawer-nav a::before{
    content:"→";
    color:var(--amber);
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
    opacity:0;
    transition:opacity .15s ease;
    width:0;
  }
  .drawer-nav a:hover{background:var(--forest-soft); padding-left:10px;}
  .drawer-nav a:hover::before{opacity:1; width:14px;}

  .drawer-footer{
    border-top:1px solid var(--forest-soft);
    padding:16px 10px 22px;
  }
  .drawer-footer .label{
    font-size:0.62rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding:4px 14px 8px;
  }
  .drawer-footer a{
    display:block;
    padding:6px 14px;
    font-size:0.8rem;
    color:var(--moss-light);
    border-radius:3px;
  }
  .drawer-footer a:hover{background:var(--forest-soft); color:var(--paper);}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1140px;
    margin:0 auto;
    padding:44px 24px 60px;
    display:grid;
    grid-template-columns:minmax(0,640px) 260px;
    gap:56px;
    justify-content:center;
  }

  .page-head{
    margin-bottom:8px;
    padding-bottom:20px;
    border-bottom:2px solid var(--forest);
  }
  .page-head .mono{
    font-size:0.75rem;
    color:var(--moss);
    letter-spacing:.08em;
  }
  .page-head h1{
    font-size:2.1rem;
    margin:6px 0 0;
    color:var(--forest);
  }

  /* ---------- Post index list ---------- */
  #postList{ position:relative; }
  .post-row{
    display:grid;
    grid-template-columns:44px 1fr;
    gap:16px;
    padding:26px 0;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .post-index{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.82rem;
    color:var(--moss);
    padding-top:4px;
  }
  .post-body .post-meta{
    display:flex;
    gap:10px;
    align-items:center;
    font-size:0.72rem;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .post-body .post-meta .cat{
    color:var(--amber);
    font-weight:600;
  }
  .post-body h2{
    margin:0 0 8px;
    font-size:1.32rem;
    font-weight:400;
    line-height:1.32;
    color:var(--ink);
  }
  .post-body h2 a{
    background-image:linear-gradient(var(--moss-light), var(--moss-light));
    background-repeat:no-repeat;
    background-position:0 100%;
    background-size:0% 1.5px;
    transition:background-size .2s ease;
    padding-bottom:1px;
  }
  .post-body h2 a:hover{ background-size:100% 1.5px; }
  .post-body p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.92rem;
    max-width:52ch;
  }

  .empty-state{
    padding:40px 4px;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  #sentinel{height:1px;}
  .loader{
    display:none;
    align-items:center;
    gap:8px;
    padding:20px 0;
    color:var(--ink-soft);
    font-size:0.82rem;
    font-family:'IBM Plex Mono', monospace;
  }
  .loader.show{display:flex;}
  .loader .dot-flash{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--moss);
    animation:flash 1s ease-in-out infinite;
  }
  @keyframes flash{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

  /* ---------- Right sidebar ---------- */
  .aside{ display:flex; flex-direction:column; gap:22px; }

  .postcard{
    background:var(--card);
    border:1.5px dashed var(--forest);
    border-radius:var(--radius);
    padding:24px 20px;
    position:relative;
  }
  .postcard::before{
    content:"";
    position:absolute;
    top:-8px; right:16px;
    width:34px; height:16px;
    background:var(--amber);
    opacity:.85;
    transform:rotate(-3deg);
  }
  .postcard-photo{
    width:64px;height:64px;
    object-fit:cover;
    border:4px solid #fff;
    box-shadow:0 2px 6px rgba(20,32,22,.18);
    transform:rotate(-3deg);
    margin-bottom:14px;
  }
  .postcard h3{
    font-family:'DM Serif Display', serif;
    font-weight:400;
    font-size:1.1rem;
    margin:0 0 8px;
    color:var(--forest);
  }
  .postcard p{
    font-size:0.86rem;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .postcard-socials{
    display:flex;
    flex-wrap:wrap;
    gap:4px 10px;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.76rem;
  }
  .postcard-socials a{
    color:var(--moss);
    border-bottom:1px solid transparent;
  }
  .postcard-socials a:hover{ border-bottom-color:var(--moss); }
  .postcard-socials .sep{ color:var(--line); }

  .tags-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .tags-card h4{
    font-size:0.68rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .tag-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .tag-list a{
    font-size:0.78rem;
    padding:5px 11px;
    border:1px solid var(--forest);
    border-radius:20px;
    color:var(--forest);
    transition:background .15s ease, color .15s ease;
  }
  .tag-list a:hover{ background:var(--forest); color:var(--paper); }

  footer.site-footer{
    text-align:center;
    padding:26px 24px 40px;
    color:var(--ink-soft);
    font-size:0.78rem;
    font-family:'IBM Plex Mono', monospace;
    border-top:1px solid var(--line);
  }

  @media (max-width:920px){
    .layout{ grid-template-columns:minmax(0,600px); }
    .aside{ display:none; }
  }
  @media (max-width:560px){
    .search-field.open{ width:130px; }
    .topbar{ padding:14px 16px; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="drawer" id="drawer" aria-label="Site menu">
  <div class="drawer-head">
    <span class="display" id="drawerTitle">Fernwood</span>
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">✕</button>
  </div>
  <nav class="drawer-nav">
    <div class="label">Browse</div>
    <a href="index.html">Home</a>
    <a href="#" data-cat="all">All entries</a>
    <div class="label" id="drawerCategoriesLabel" style="display:none;">Categories</div>
    <div id="drawerCategories"></div>
  </nav>
  <div class="drawer-footer" id="drawerFooter">
    <div class="label">Important pages</div>
  </div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button class="badge-toggle" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span>
    </button>
    <a href="index.html" class="brand">
      <span class="monogram" id="monogramText">F</span>
      <span class="brand-text">
        <span class="site-name" id="siteNameText">Fernwood Journal</span>
        <span class="tagline" id="siteTaglineText">Field notes on a slower life</span>
      </span>
    </a>
  </div>

  <div class="topbar-center">
    <span class="display site-name">Fernwood</span>
  </div>

  <div class="topbar-right">
    <div class="search-field" id="searchField">
      <input type="search" id="searchInput" placeholder="search…" aria-label="Search posts">
    </div>
    <button class="search-toggle" id="searchToggle" aria-label="Toggle search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section>
    <div class="page-head">
      <div class="mono" id="headEyebrow">LATEST ENTRIES</div>
      <h1 class="display" id="headTitle">From the field</h1>
    </div>

    <ul id="postList"></ul>
    <div class="empty-state" id="emptyState" style="display:none;">No entries match that search. Try another word.</div>

    <div id="sentinel"></div>
    <div class="loader" id="loader">
      <span class="dot-flash"></span>
      loading more entries…
    </div>
  </section>

  <aside class="aside">
    <div class="postcard">
      <img class="postcard-photo" id="authorPhoto" src="" alt="">
      <h3 id="authorName"></h3>
      <p id="authorBio"></p>
      <div class="postcard-socials" id="authorSocials"></div>
    </div>

    <div class="tags-card" id="tagsCard" style="display:none;">
      <h4>Filed under</h4>
      <div class="tag-list" id="tagList"></div>
    </div>
  </aside>
</main>

<footer class="site-footer" id="siteFooter">
  © <span id="year"></span> Fernwood Journal
</footer>

<script>
(function(){
  "use strict";

  const PAGE_SIZE = 10;
  const state = { allPosts: [], filtered: [], rendered: 0, query: "" };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function renderSite(data){
    document.getElementById('siteNameText').textContent = data.site.name;
    document.getElementById('siteTaglineText').textContent = data.site.tagline;
    document.getElementById('drawerTitle').textContent = data.site.name.split(' ')[0];
    document.getElementById('monogramText').textContent = data.site.monogram || data.site.name.charAt(0);
    document.title = data.site.name + " — " + data.site.tagline;
    document.getElementById('siteFooter').innerHTML =
      "© <span id='year'></span> " + escapeHtml(data.site.name);
    document.getElementById('year').textContent = new Date().getFullYear();
    document.querySelector('.topbar-center .site-name').textContent = data.site.name.split(' ')[0];
  }

  function renderAuthor(author){
    document.getElementById('authorPhoto').src = author.photo;
    document.getElementById('authorPhoto').alt = author.name;
    document.getElementById('authorName').textContent = author.name;
    document.getElementById('authorBio').textContent = author.bio;
    const wrap = document.getElementById('authorSocials');
    wrap.innerHTML = author.socials.map((s,i) =>
      (i>0 ? '<span class="sep">·</span>' : '') +
      `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.name)}</a>`
    ).join('');
  }

  function renderFooterPages(pages){
    const el = document.getElementById('drawerFooter');
    pages.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url;
      a.textContent = p.title;
      el.appendChild(a);
    });
  }

  function renderCategories(posts){
    const counts = {};
    posts.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
    const cats = Object.keys(counts).sort();
    if(!cats.length) return;

    document.getElementById('tagList').innerHTML = cats.map(c =>
      `<a href="#" data-cat="${escapeHtml(c)}">${escapeHtml(c)} · ${counts[c]}</a>`
    ).join('');
    document.getElementById('tagsCard').style.display = 'block';

    document.getElementById('drawerCategoriesLabel').style.display = 'block';
    document.getElementById('drawerCategories').innerHTML = cats.map(c =>
      `<a href="#" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</a>`
    ).join('');
  }

  function postRowHtml(post, idx){
    return `
      <li class="post-row">
        <div class="post-index mono">${pad(idx+1)}</div>
        <div class="post-body">
          <div class="post-meta">
            <span class="cat">${escapeHtml(post.category)}</span>
            <span>${formatDate(post.date)}</span>
          </div>
          <h2><a href="${escapeHtml(post.url)}">${escapeHtml(post.title)}</a></h2>
          <p>${escapeHtml(post.excerpt)}</p>
        </div>
      </li>`;
  }

  function renderNextBatch(){
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');
    const start = state.rendered;
    const next = state.filtered.slice(start, start + PAGE_SIZE);

    if(state.rendered === 0){ list.innerHTML = ""; }
    if(state.filtered.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.insertAdjacentHTML('beforeend', next.map((p,i) => postRowHtml(p, start+i)).join(''));
    }
    state.rendered += next.length;
    updateHead();
  }

  function updateHead(){
    const eyebrow = document.getElementById('headEyebrow');
    const title = document.getElementById('headTitle');
    if(state.query){
      eyebrow.textContent = `${state.filtered.length} RESULT${state.filtered.length===1?'':'S'}`;
      title.textContent = `"${state.query}"`;
    } else {
      eyebrow.textContent = "LATEST ENTRIES";
      title.textContent = "From the field";
    }
  }

  function applyFilter(query, category){
    state.query = query.trim();
    const q = state.query.toLowerCase();
    state.filtered = state.allPosts.filter(p => {
      const matchesQuery = !q || p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q);
      const matchesCat = !category || category === 'all' || p.category === category;
      return matchesQuery && matchesCat;
    });
    state.rendered = 0;
    renderNextBatch();
  }

  let debounceTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const val = e.target.value;
    debounceTimer = setTimeout(() => applyFilter(val), 180);
  });

  document.addEventListener('click', (e) => {
    const catLink = e.target.closest('[data-cat]');
    if(catLink){
      e.preventDefault();
      document.getElementById('searchInput').value = "";
      applyFilter("", catLink.dataset.cat);
      closeDrawer();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });

  /* ---------- Infinite scroll ---------- */
  const loader = document.getElementById('loader');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting && state.rendered < state.filtered.length){
        loader.classList.add('show');
        setTimeout(() => {
          renderNextBatch();
          loader.classList.remove('show');
        }, 250);
      }
    });
  }, { rootMargin: '200px' });
  observer.observe(document.getElementById('sentinel'));

  /* ---------- Drawer toggle ---------- */
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menuBtn');

  function openDrawer(){
    drawer.classList.add('open');
    overlay.classList.add('show');
    menuBtn.classList.add('active');
    menuBtn.setAttribute('aria-expanded','true');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    overlay.classList.remove('show');
    menuBtn.classList.remove('active');
    menuBtn.setAttribute('aria-expanded','false');
  }
  menuBtn.addEventListener('click', () => {
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  overlay.addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeDrawer(); });

  /* ---------- Search reveal ---------- */
  const searchField = document.getElementById('searchField');
  const searchToggle = document.getElementById('searchToggle');
  const searchInput = document.getElementById('searchInput');
  searchToggle.addEventListener('click', () => {
    searchField.classList.toggle('open');
    if(searchField.classList.contains('open')) searchInput.focus();
  });

  /* ---------- Load data ---------- */
  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(res => {
      if(!res.ok) throw new Error('Network response was not ok');
      return res.json();
    })
    .then(data => {
      renderSite(data);
      renderAuthor(data.author);
      renderFooterPages(data.pages);
      renderCategories(data.posts);
      state.allPosts = data.posts;
      state.filtered = data.posts;
      renderNextBatch();
    })
    .catch(err => {
      document.getElementById('postList').innerHTML =
        `<li class="empty-state" style="display:block;">Could not load entries. If you opened this file directly, run a local server (e.g. <code>python3 -m http.server</code>) so data.json can be fetched — browsers block fetch() on file:// pages.</li>`;
      console.error(err);
    });
})();
</script>
</body>
</html>
