
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdant Notes — Slow thoughts on simple living</title>
<meta name="description" content="A quiet corner of the internet for notes on plants, kitchens, and slow living.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8f2;
    --surface:#eaf1e3;
    --card:#ffffff;
    --green-deep:#1f3d2b;
    --green:#3f7d4f;
    --green-soft:#8fb996;
    --green-pale:#dfead8;
    --text:#28312a;
    --text-muted:#66715f;
    --border:#dbe6d3;
    --shadow: 0 1px 2px rgba(31,61,43,0.05), 0 4px 16px rgba(31,61,43,0.06);
    --radius: 14px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;margin:0;padding:0;}
  img{max-width:100%;display:block;}
  button{font:inherit;}

  .site-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-optical-sizing:auto;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 20px;
    background:rgba(245,248,242,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
  }
  .topbar-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .menu-btn{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    cursor:pointer;
    flex:none;
  }
  .menu-btn span{
    display:block;
    width:16px;
    height:2px;
    margin:0 auto;
    background:var(--green-deep);
    transition:transform .2s ease, opacity .2s ease;
  }
  .menu-btn.active span:nth-child(1){transform:translateY(6px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .brand-icon{
    width:30px;
    height:30px;
    flex:none;
    color:var(--green);
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.1;
    min-width:0;
  }
  .brand-text .site-name{
    font-size:1.18rem;
    color:var(--green-deep);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-text .tagline{
    font-size:0.72rem;
    color:var(--text-muted);
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .search-wrap{
    position:relative;
    width:min(280px, 40vw);
    flex:none;
  }
  .search-wrap svg{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--text-muted);
  }
  #searchInput{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.88rem;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  #searchInput:focus{
    border-color:var(--green-soft);
    box-shadow:0 0 0 3px var(--green-pale);
  }

  /* ---------- Sidebar ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,32,22,0.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:45;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  .sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100%;
    width:270px;
    background:var(--surface);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:transform .25s ease;
    z-index:50;
    display:flex;
    flex-direction:column;
    padding:20px 0 0;
  }
  .sidebar.open{transform:translateX(0);}

  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px 18px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-close{
    width:30px;height:30px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    cursor:pointer;
    color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;
  }

  .sidebar-nav{
    padding:16px 10px;
    overflow-y:auto;
    flex:1;
  }
  .sidebar-nav .section-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-muted);
    padding:8px 12px 6px;
  }
  .sidebar-nav a{
    display:block;
    padding:9px 12px;
    border-radius:9px;
    font-size:0.93rem;
    color:var(--green-deep);
    transition:background .15s ease;
  }
  .sidebar-nav a:hover{background:var(--green-pale);}

  .sidebar-footer{
    border-top:1px solid var(--border);
    padding:14px 10px 18px;
  }
  .sidebar-footer .section-label{
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-muted);
    padding:4px 12px 6px;
  }
  .sidebar-footer a{
    display:block;
    padding:6px 12px;
    font-size:0.82rem;
    color:var(--text-muted);
    border-radius:7px;
    transition:background .15s ease, color .15s ease;
  }
  .sidebar-footer a:hover{background:var(--green-pale); color:var(--green-deep);}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1180px;
    margin:0 auto;
    padding:36px 20px 60px;
    display:grid;
    grid-template-columns:minmax(0,700px) 280px;
    gap:48px;
    justify-content:center;
  }

  .page-head{
    margin-bottom:28px;
  }
  .page-head .eyebrow{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--green);
    font-weight:600;
  }
  .page-head h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    color:var(--green-deep);
    margin:6px 0 0;
  }

  /* ---------- Post list ---------- */
  #postList{}
  .post-row{
    padding:20px 4px;
    border-bottom:1px solid var(--border);
  }
  .post-row:first-child{padding-top:4px;}
  .post-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:0.78rem;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .post-meta .cat{
    color:var(--green);
    font-weight:600;
  }
  .post-meta .dot{
    width:3px;height:3px;border-radius:50%;
    background:var(--text-muted);
  }
  .post-row h2{
    margin:0 0 6px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.28rem;
    line-height:1.3;
  }
  .post-row h2 a{
    display:inline;
    background-image:linear-gradient(var(--green-soft), var(--green-soft));
    background-repeat:no-repeat;
    background-position:0 100%;
    background-size:0% 2px;
    transition:background-size .2s ease, color .2s ease;
    padding-bottom:1px;
  }
  .post-row h2 a:hover{
    background-size:100% 2px;
    color:var(--green-deep);
  }
  .post-row p{
    margin:0;
    color:var(--text-muted);
    font-size:0.93rem;
  }

  .empty-state{
    padding:40px 4px;
    color:var(--text-muted);
    font-size:0.95rem;
  }

  #sentinel{height:1px;}
  .loader{
    display:none;
    align-items:center;
    gap:8px;
    padding:18px 4px;
    color:var(--text-muted);
    font-size:0.85rem;
  }
  .loader.show{display:flex;}
  .loader .leaf-spin{
    width:14px;height:14px;
    color:var(--green);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Right sidebar / author ---------- */
  .aside{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .author-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    text-align:center;
  }
  .author-card img{
    width:76px;height:76px;
    border-radius:50%;
    margin:0 auto 12px;
    object-fit:cover;
    border:3px solid var(--green-pale);
  }
  .author-card h3{
    font-family:'Fraunces', serif;
    font-size:1.08rem;
    margin:0 0 8px;
    color:var(--green-deep);
  }
  .author-card p{
    font-size:0.86rem;
    color:var(--text-muted);
    margin:0 0 16px;
  }
  .socials{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .socials a{
    width:34px;height:34px;
    border-radius:50%;
    background:var(--green-pale);
    color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .socials a:hover{background:var(--green); color:#fff;}
  .socials svg{width:16px;height:16px;}

  .categories-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:var(--shadow);
  }
  .categories-card h4{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-muted);
    margin:0 0 12px;
  }
  .categories-card ul li{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px dashed var(--border);
    font-size:0.88rem;
  }
  .categories-card ul li:last-child{border-bottom:none;}
  .categories-card .count{
    color:var(--text-muted);
    font-size:0.8rem;
  }

  footer.site-footer{
    text-align:center;
    padding:30px 20px 40px;
    color:var(--text-muted);
    font-size:0.82rem;
    border-top:1px solid var(--border);
  }

  @media (max-width:920px){
    .layout{grid-template-columns:minmax(0,640px); }
    .aside{
      grid-row:1;
      flex-direction:row;
      overflow-x:auto;
    }
    .aside{display:none;}
  }
  @media (max-width:640px){
    .search-wrap{width:min(160px, 45vw);}
    .brand-text .tagline{display:none;}
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar" aria-label="Site menu">
  <div class="sidebar-head">
    <span class="site-name" style="color:var(--green-deep); font-size:1.05rem;">Menu</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="sidebar-nav">
    <div class="section-label">Browse</div>
    <a href="index.html">Home</a>
    <a href="#" data-cat="all">All Posts</a>
    <div class="section-label" id="sidebarCategoriesLabel" style="display:none;">Categories</div>
    <div id="sidebarCategories"></div>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter">
    <div class="section-label">Important Pages</div>
  </div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 6C13 6 7 15 7 24c0 9 6 18 17 18 9 0 15-7 15-17C39 14 33 6 24 6Z" fill="var(--green-pale)"/>
        <path d="M24 40c0-14 0-22 12-30" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M24 40c0-11-4-17-12-22" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <span class="site-name" id="siteNameText">Verdant Notes</span>
        <span class="tagline" id="siteTaglineText">Slow thoughts on simple living</span>
      </span>
    </a>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
    <input type="search" id="searchInput" placeholder="Search posts…" aria-label="Search posts">
  </div>
</header>

<main class="layout">
  <section>
    <div class="page-head">
      <div class="eyebrow" id="headEyebrow">Latest</div>
      <h1 id="headTitle">From the journal</h1>
    </div>

    <ul id="postList"></ul>
    <div class="empty-state" id="emptyState" style="display:none;">No posts match your search. Try a different word.</div>

    <div id="sentinel"></div>
    <div class="loader" id="loader">
      <svg class="leaf-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c5 0 9 4 9 9-5 0-9-4-9-9Z"/><path d="M12 21c-5 0-9-4-9-9 5 0 9 4 9 9Z"/></svg>
      Loading more posts…
    </div>
  </section>

  <aside class="aside">
    <div class="author-card">
      <img id="authorPhoto" src="" alt="">
      <h3 id="authorName"></h3>
      <p id="authorBio"></p>
      <div class="socials" id="authorSocials"></div>
    </div>

    <div class="categories-card" id="categoriesCard" style="display:none;">
      <h4>Categories</h4>
      <ul id="categoriesList"></ul>
    </div>
  </aside>
</main>

<footer class="site-footer" id="siteFooter">
  © <span id="year"></span> Verdant Notes. All rights reserved.
</footer>

<script>
(function(){
  "use strict";

  const PAGE_SIZE = 10;
  const state = {
    allPosts: [],
    filtered: [],
    rendered: 0,
    query: ""
  };

  const socialIcons = {
    twitter: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.4-1.3 1.7-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 0 0-7 3.7A11.6 11.6 0 0 1 3.4 4.6a4.1 4.1 0 0 0 1.3 5.5c-.7 0-1.3-.2-1.9-.5v.1c0 2 1.4 3.7 3.3 4a4.1 4.1 0 0 1-1.9.1 4.1 4.1 0 0 0 3.8 2.9A8.3 8.3 0 0 1 2 18.4a11.6 11.6 0 0 0 6.3 1.8c7.5 0 11.6-6.2 11.6-11.6v-.5c.8-.6 1.5-1.3 2.1-2.2Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.2-.4-4.7a2.8 2.8 0 0 0-2-2C17.9 5 12 5 12 5s-5.9 0-7.6.3a2.8 2.8 0 0 0-2 2C2 8.8 2 12 2 12s0 3.2.4 4.7a2.8 2.8 0 0 0 2 2C6.1 19 12 19 12 19s5.9 0 7.6-.3a2.8 2.8 0 0 0 2-2C22 15.2 22 12 22 12Z"/><path d="M10 15.5v-7l6 3.5-6 3.5Z" fill="var(--card)"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function renderSite(data){
    document.getElementById('siteNameText').textContent = data.site.name;
    document.getElementById('siteTaglineText').textContent = data.site.tagline;
    document.title = data.site.name + " — " + data.site.tagline;
    document.getElementById('siteFooter').innerHTML =
      "© <span id='year'></span> " + escapeHtml(data.site.name) + ". All rights reserved.";
    document.getElementById('year').textContent = new Date().getFullYear();
  }

  function renderAuthor(author){
    document.getElementById('authorPhoto').src = author.photo;
    document.getElementById('authorPhoto').alt = author.name;
    document.getElementById('authorName').textContent = author.name;
    document.getElementById('authorBio').textContent = author.bio;
    const wrap = document.getElementById('authorSocials');
    wrap.innerHTML = author.socials.map(s =>
      `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" aria-label="${escapeHtml(s.name)}">${socialIcons[s.icon] || ''}</a>`
    ).join('');
  }

  function renderFooterPages(pages){
    const el = document.getElementById('sidebarFooter');
    pages.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url;
      a.textContent = p.title;
      el.appendChild(a);
    });
  }

  function renderCategories(posts){
    const counts = {};
    posts.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
    const cats = Object.keys(counts).sort();
    if(!cats.length) return;

    const list = document.getElementById('categoriesList');
    list.innerHTML = cats.map(c =>
      `<li><a href="#" data-cat="${escapeHtml(c)}" style="color:inherit;">${escapeHtml(c)}</a><span class="count">${counts[c]}</span></li>`
    ).join('');
    document.getElementById('categoriesCard').style.display = 'block';

    const sideLabel = document.getElementById('sidebarCategoriesLabel');
    const sideWrap = document.getElementById('sidebarCategories');
    sideLabel.style.display = 'block';
    sideWrap.innerHTML = cats.map(c =>
      `<a href="#" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</a>`
    ).join('');
  }

  function postRowHtml(post){
    return `
      <li class="post-row">
        <div class="post-meta">
          <span class="cat">${escapeHtml(post.category)}</span>
          <span class="dot"></span>
          <span>${formatDate(post.date)}</span>
        </div>
        <h2><a href="${escapeHtml(post.url)}">${escapeHtml(post.title)}</a></h2>
        <p>${escapeHtml(post.excerpt)}</p>
      </li>`;
  }

  function renderNextBatch(){
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');
    const next = state.filtered.slice(state.rendered, state.rendered + PAGE_SIZE);

    if(state.rendered === 0){
      list.innerHTML = "";
    }
    if(state.filtered.length === 0){
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      list.insertAdjacentHTML('beforeend', next.map(postRowHtml).join(''));
    }
    state.rendered += next.length;
    updateHead();
  }

  function updateHead(){
    const eyebrow = document.getElementById('headEyebrow');
    const title = document.getElementById('headTitle');
    if(state.query){
      eyebrow.textContent = `${state.filtered.length} result${state.filtered.length === 1 ? '' : 's'}`;
      title.textContent = `Search: "${state.query}"`;
    } else {
      eyebrow.textContent = "Latest";
      title.textContent = "From the journal";
    }
  }

  function applyFilter(query, category){
    state.query = query.trim();
    const q = state.query.toLowerCase();
    state.filtered = state.allPosts.filter(p => {
      const matchesQuery = !q || p.title.toLowerCase().includes(q) || p.excerpt.toLowerCase().includes(q);
      const matchesCat = !category || category === 'all' || p.category === category;
      return matchesQuery && matchesCat;
    });
    state.rendered = 0;
    renderNextBatch();
  }

  let debounceTimer;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const val = e.target.value;
    debounceTimer = setTimeout(() => applyFilter(val), 180);
  });

  document.addEventListener('click', (e) => {
    const catLink = e.target.closest('[data-cat]');
    if(catLink){
      e.preventDefault();
      document.getElementById('searchInput').value = "";
      applyFilter("", catLink.dataset.cat);
      closeSidebar();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });

  /* ---------- Infinite scroll ---------- */
  const loader = document.getElementById('loader');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting && state.rendered < state.filtered.length){
        loader.classList.add('show');
        setTimeout(() => {
          renderNextBatch();
          loader.classList.remove('show');
        }, 250);
      }
    });
  }, { rootMargin: '200px' });
  observer.observe(document.getElementById('sentinel'));

  /* ---------- Sidebar toggle ---------- */
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menuBtn');

  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('show');
    menuBtn.classList.add('active');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    menuBtn.classList.remove('active');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeSidebar();
  });

  /* ---------- Load data ---------- */
  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(res => {
      if(!res.ok) throw new Error('Network response was not ok');
      return res.json();
    })
    .then(data => {
      renderSite(data);
      renderAuthor(data.author);
      renderFooterPages(data.pages);
      renderCategories(data.posts);
      state.allPosts = data.posts;
      state.filtered = data.posts;
      renderNextBatch();
    })
    .catch(err => {
      document.getElementById('postList').innerHTML =
        `<li class="empty-state" style="display:block;">Could not load posts. If you opened this file directly, run a local server (e.g. <code>python3 -m http.server</code>) so data.json can be fetched — browsers block fetch() on file:// pages.</li>`;
      console.error(err);
    });
})();
</script>
</body>
</html>
