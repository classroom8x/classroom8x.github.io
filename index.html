<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Verdant Notes — Slow thoughts on simple living</title>
<meta name="description" content="A quiet corner of the internet for notes on plants, kitchens, and slow living.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f8f2;
    --surface:#eaf1e3;
    --card:#ffffff;
    --green-deep:#1f3d2b;
    --green:#3f7d4f;
    --green-soft:#8fb996;
    --green-pale:#dfead8;
    --text:#28312a;
    --text-muted:#66715f;
    --border:#dbe6d3;
    --highlight-bg:#ffe58f;
    --highlight-text:#1f3d2b;
    --shadow-sm: 0 2px 6px rgba(31,61,43,0.04);
    --shadow-md: 0 4px 16px rgba(31,61,43,0.08);
    --radius: 12px;
    --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  ul{list-style:none;margin:0;padding:0;}
  img{max-width:100%;display:block;}
  button{font:inherit;}

  .site-name{
    font-family:'Fraunces', serif;
    font-weight:600;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 16px;
    background:rgba(245,248,242,0.95);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-left{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .menu-btn{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:4px;
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:9px;
    background:var(--card);
    cursor:pointer;
    flex:none;
    padding:0;
  }
  .menu-btn span{
    display:block;
    width:16px;
    height:2px;
    margin:0 auto;
    background:var(--green-deep);
    transition:transform .2s ease, opacity .2s ease;
  }
  .menu-btn.active span:nth-child(1){transform:translateY(6px) rotate(45deg);}
  .menu-btn.active span:nth-child(2){opacity:0;}
  .menu-btn.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .brand-icon{
    width:28px;
    height:28px;
    flex:none;
    color:var(--green);
  }
  .brand-text{
    display:flex;
    flex-direction:column;
    line-height:1.15;
    min-width:0;
  }
  .brand-text .site-name{
    font-size:1.15rem;
    color:var(--green-deep);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand-text .tagline{
    font-size:0.7rem;
    color:var(--text-muted);
    letter-spacing:.02em;
    white-space:nowrap;
  }

  .search-wrap{
    position:relative;
    width:min(240px, 42vw);
    flex:none;
  }
  .search-wrap .search-icon{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    width:15px;height:15px;
    color:var(--text-muted);
    pointer-events:none;
  }
  .search-clear{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--text-muted);
    cursor:pointer;
    padding:6px;
    display:none;
    border-radius:50%;
    align-items:center;
    justify-content:center;
  }
  .search-clear:hover{color:var(--green-deep);}
  #searchInput{
    width:100%;
    padding:8px 30px 8px 32px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:0.86rem;
    outline:none;
    transition:var(--transition);
  }
  #searchInput:focus{
    border-color:var(--green-soft);
    box-shadow:0 0 0 3px var(--green-pale);
  }

  /* ---------- Sidebar Navigation ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(20,32,22,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:45;
  }
  .overlay.show{opacity:1;pointer-events:auto;}

  .sidebar{
    position:fixed;
    top:0;
    left:0;
    height:100%;
    width:min(280px, 85vw);
    background:var(--surface);
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(0.4, 0, 0.2, 1);
    z-index:50;
    display:flex;
    flex-direction:column;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px;
    border-bottom:1px solid var(--border);
  }
  .sidebar-close{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--green-deep);
  }
  .sidebar-nav{
    padding:14px 10px;
    overflow-y:auto;
    flex:1;
  }
  .sidebar-nav .section-label, .sidebar-footer .section-label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-muted);
    padding:8px 10px 4px;
    font-weight:600;
  }
  .sidebar-nav a{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-radius:8px;
    font-size:0.92rem;
    color:var(--green-deep);
    font-weight:500;
    transition:var(--transition);
  }
  .sidebar-nav a:hover, .sidebar-nav a.active{background:var(--green-pale);}
  .sidebar-footer{
    border-top:1px solid var(--border);
    padding:12px 10px 16px;
  }
  .sidebar-footer a{
    display:block;
    padding:8px 12px;
    font-size:0.84rem;
    color:var(--text-muted);
    border-radius:6px;
  }
  .sidebar-footer a:hover{background:var(--green-pale); color:var(--green-deep);}

  /* ---------- Layout ---------- */
  .layout{
    max-width:1120px;
    margin:0 auto;
    padding:28px 16px 60px;
    display:grid;
    grid-template-columns:minmax(0, 1fr) 280px;
    gap:40px;
  }

  .feed-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:16px;
  }
  .chips-scroll-wrap{
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    flex:1;
    min-width:0;
  }
  .chips-scroll-wrap::-webkit-scrollbar{display:none;}
  .chips-list{
    display:inline-flex;
    gap:6px;
    padding:2px 0;
  }
  .chip{
    padding:6px 13px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    font-size:0.8rem;
    color:var(--text-muted);
    font-weight:500;
    cursor:pointer;
    transition:var(--transition);
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:4px;
    min-height:32px;
  }
  .chip:hover, .chip.active{
    background:var(--green-deep);
    color:#ffffff;
    border-color:var(--green-deep);
  }

  .sort-select{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:6px 10px;
    border-radius:10px;
    font-size:0.8rem;
    outline:none;
    cursor:pointer;
    flex:none;
    height:32px;
  }

  /* ---------- Post Cards ---------- */
  .post-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:clamp(16px, 3.5vw, 22px);
    margin-bottom:14px;
    box-shadow:var(--shadow-sm);
    transition:var(--transition);
  }
  .post-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
    border-color:var(--green-soft);
  }
  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
  }
  .post-meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:6px;
    font-size:0.76rem;
    color:var(--text-muted);
  }
  .cat-pill{
    background:var(--green-pale);
    color:var(--green-deep);
    padding:2px 8px;
    border-radius:10px;
    font-weight:600;
    font-size:0.72rem;
    cursor:pointer;
    transition:var(--transition);
  }
  .cat-pill:hover{background:var(--green); color:#fff;}
  
  .post-actions{
    display:flex;
    align-items:center;
    gap:4px;
    flex:none;
  }
  .action-btn{
    background:transparent;
    border:none;
    color:var(--text-muted);
    width:32px;
    height:32px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:var(--transition);
    padding:0;
  }
  .action-btn:hover{background:var(--green-pale); color:var(--green-deep);}
  .action-btn.saved{color:#d97706;}
  .action-btn svg{width:16px;height:16px;}

  .post-card h2{
    margin:0 0 6px;
    font-family:'Fraunces', serif;
    font-size:clamp(1.18rem, 3.5vw, 1.35rem);
    line-height:1.35;
  }
  .post-card h2 a{color:var(--green-deep); transition:color .2s;}
  .post-card h2 a:hover{color:var(--green);}
  .post-card p{
    margin:0;
    color:var(--text-muted);
    font-size:0.92rem;
    line-height:1.55;
  }

  /* Search Highlight */
  mark.highlight{
    background:var(--highlight-bg);
    color:var(--highlight-text);
    padding:0 2px;
    border-radius:2px;
  }

  /* Load More Button Container */
  .load-more-wrap{
    text-align:center;
    margin:28px 0 10px;
    display:none;
  }
  .load-more-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 28px;
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:25px;
    color:var(--green-deep);
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
    box-shadow:var(--shadow-sm);
    transition:var(--transition);
  }
  .load-more-btn:hover{
    background:var(--green-pale);
    border-color:var(--green-soft);
    transform:translateY(-2px);
    box-shadow:var(--shadow-md);
  }
  .load-more-btn.loading .btn-text{display:none;}
  .load-more-btn.loading .leaf-spin{display:block;}
  .load-more-btn .leaf-spin{display:none; width:16px; height:16px; color:var(--green); animation:spin 1s linear infinite;}

  /* Skeletons */
  .skeleton-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:14px;
  }
  .skeleton{
    background:linear-gradient(90deg, var(--surface) 25%, var(--bg) 50%, var(--surface) 75%);
    background-size:200% 100%;
    animation:shimmer 1.5s infinite;
    border-radius:6px;
  }
  @keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Aside Widgets */
  .aside{
    display:flex;
    flex-direction:column;
    gap:20px;
  }
  .author-card, .categories-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow-sm);
  }
  .author-card{text-align:center;}
  .author-card img{
    width:72px;height:72px;
    border-radius:50%;
    margin:0 auto 10px;
    object-fit:cover;
    border:3px solid var(--green-pale);
  }
  .author-card h3{font-family:'Fraunces', serif; font-size:1.1rem; margin:0 0 4px; color:var(--green-deep);}
  .author-card p{font-size:0.84rem; color:var(--text-muted); margin:0 0 14px;}
  .socials{display:flex; justify-content:center; gap:8px;}
  .socials a{
    width:34px;height:34px;border-radius:50%;
    background:var(--green-pale);color:var(--green-deep);
    display:flex;align-items:center;justify-content:center;
    transition:var(--transition);
  }
  .socials a:hover{background:var(--green);color:#fff;}
  .socials svg{width:15px;height:15px;}

  .categories-card h4{font-size:0.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin:0 0 10px;}
  .categories-card ul li{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:0.86rem;}
  .categories-card ul li:last-child{border-bottom:none;}
  .categories-card .count{background:var(--surface); color:var(--text-muted); font-size:0.75rem; font-weight:600; padding:1px 7px; border-radius:8px;}

  /* Toast Notification */
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(100px);
    background:var(--green-deep);
    color:#ffffff;
    padding:10px 18px;
    border-radius:24px;
    font-size:0.84rem;
    font-weight:500;
    box-shadow:var(--shadow-md);
    opacity:0;
    pointer-events:none;
    transition:all 0.25s ease;
    z-index:90;
    white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}

  /* Back to Top */
  .back-to-top{
    position:fixed;
    bottom:20px;
    right:16px;
    width:40px;height:40px;
    background:var(--green-deep);
    color:#ffffff;
    border-radius:50%;
    border:none;
    box-shadow:var(--shadow-md);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:var(--transition);
    z-index:35;
  }
  .back-to-top.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .back-to-top:hover{background:var(--green);}

  .empty-state{
    text-align:center;
    padding:40px 16px;
    background:var(--card);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    color:var(--text-muted);
    font-size:0.9rem;
  }
  .reset-btn{
    margin-top:10px;
    padding:7px 16px;
    background:var(--green-pale);
    color:var(--green-deep);
    border:1px solid var(--border);
    border-radius:16px;
    font-weight:600;
    font-size:0.84rem;
    cursor:pointer;
  }
  .reset-btn:hover{background:var(--green); color:#fff;}

  footer.site-footer{text-align:center; padding:28px 16px 36px; color:var(--text-muted); font-size:0.82rem; border-top:1px solid var(--border);}

  /* ---------- Responsive Breakpoints ---------- */
  @media (max-width:880px){
    /* Mobile me 1-column layout banega aur sidebar feed ke niche dikhega */
    .layout{
      grid-template-columns:100%;
      gap:32px;
      padding:18px 14px 40px;
    }
    .aside{
      display:flex;
      margin-top:10px;
    }
  }

  @media (max-width:540px){
    .topbar{padding:10px 12px;}
    .brand-text .tagline{display:none;}
    .search-wrap{width:min(160px, 42vw);}
    #searchInput{padding:7px 24px 7px 28px; font-size:0.82rem;}
    .search-wrap .search-icon{width:13px; height:13px; left:8px;}
    .feed-controls{flex-direction:column; align-items:stretch; gap:8px;}
    .sort-select{align-self:flex-start;}
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast">Message</div>

<aside class="sidebar" id="sidebar" aria-label="Site menu">
  <div class="sidebar-head">
    <span class="site-name" style="color:var(--green-deep); font-size:1.05rem;">Menu</span>
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav class="sidebar-nav">
    <div class="section-label">Browse</div>
    <a href="#" data-cat="all" class="active">All Notes</a>
    <a href="#" id="sidebarSavedLink">Saved Notes <span class="count" id="sidebarSavedCount">0</span></a>
    <div class="section-label" id="sidebarCategoriesLabel" style="display:none;">Categories</div>
    <div id="sidebarCategories"></div>
  </nav>
  <div class="sidebar-footer" id="sidebarFooter">
    <div class="section-label">Important Pages</div>
  </div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="index.html" class="brand">
      <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 6C13 6 7 15 7 24c0 9 6 18 17 18 9 0 15-7 15-17C39 14 33 6 24 6Z" fill="var(--green-pale)"/>
        <path d="M24 40c0-14 0-22 12-30" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M24 40c0-11-4-17-12-22" stroke="var(--green)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <span class="site-name" id="siteNameText">Verdant Notes</span>
        <span class="tagline" id="siteTaglineText">Slow thoughts on simple living</span>
      </span>
    </a>
  </div>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
    <input type="search" id="searchInput" placeholder="Search..." aria-label="Search notes">
    <button class="search-clear" id="searchClear" aria-label="Clear search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
</header>

<main class="layout">
  <section>
    <div class="feed-controls">
      <div class="chips-scroll-wrap">
        <div class="chips-list" id="chipsList">
          <button class="chip active" data-cat="all">All Notes</button>
          <button class="chip" id="savedChip">🔖 Saved (<span id="savedChipCount">0</span>)</button>
        </div>
      </div>

      <select class="sort-select" id="sortSelect" aria-label="Sort posts">
        <option value="latest">Sort: Latest</option>
        <option value="oldest">Sort: Oldest</option>
      </select>
    </div>

    <ul id="postList">
      <li class="skeleton-card"><div class="skeleton" style="width:110px;height:14px;margin-bottom:10px;"></div><div class="skeleton" style="width:75%;height:20px;margin-bottom:10px;"></div><div class="skeleton" style="width:100%;height:14px;margin-bottom:6px;"></div><div class="skeleton" style="width:45%;height:14px;"></div></li>
      <li class="skeleton-card"><div class="skeleton" style="width:90px;height:14px;margin-bottom:10px;"></div><div class="skeleton" style="width:80%;height:20px;margin-bottom:10px;"></div><div class="skeleton" style="width:100%;height:14px;margin-bottom:6px;"></div><div class="skeleton" style="width:55%;height:14px;"></div></li>
    </ul>

    <div class="empty-state" id="emptyState" style="display:none;">
      <div>No notes found for your search.</div>
      <button class="reset-btn" id="resetBtn">Clear Filters</button>
    </div>

    <!-- 15 Posts ke baad Load More Button -->
    <div class="load-more-wrap" id="loadMoreWrap">
      <button class="load-more-btn" id="loadMoreBtn">
        <span class="btn-text">Load More Notes</span>
        <svg class="leaf-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c5 0 9 4 9 9-5 0-9-4-9-9Z"/><path d="M12 21c-5 0-9-4-9-9 5 0 9 4 9 9Z"/></svg>
      </button>
    </div>
  </section>

  <!-- Sidebar: Desktop par Right side rahega, Mobile par Feed ke niche automatically stack hoga -->
  <aside class="aside">
    <div class="author-card">
      <img id="authorPhoto" src="" alt="">
      <h3 id="authorName"></h3>
      <p id="authorBio"></p>
      <div class="socials" id="authorSocials"></div>
    </div>

    <div class="categories-card" id="categoriesCard" style="display:none;">
      <h4>Categories</h4>
      <ul id="categoriesList"></ul>
    </div>
  </aside>
</main>

<button class="back-to-top" id="backToTop" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<footer class="site-footer" id="siteFooter">
  © <span id="year"></span> Verdant Notes. All rights reserved.
</footer>

<script>
(function(){
  "use strict";

  // 15 Posts Batching
  const PAGE_SIZE = 15;
  const state = {
    allPosts: [],
    filtered: [],
    rendered: 0,
    query: "",
    selectedCat: "all",
    sortBy: "latest",
    showSavedOnly: false,
    savedIds: new Set(JSON.parse(localStorage.getItem('verdant_saved') || '[]'))
  };

  const socialIcons = {
    twitter: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 5.9c-.7.3-1.5.6-2.3.7.8-.5 1.4-1.3 1.7-2.3-.8.5-1.7.8-2.6 1a4.1 4.1 0 0 0-7 3.7A11.6 11.6 0 0 1 3.4 4.6a4.1 4.1 0 0 0 1.3 5.5c-.7 0-1.3-.2-1.9-.5v.1c0 2 1.4 3.7 3.3 4a4.1 4.1 0 0 1-1.9.1 4.1 4.1 0 0 0 3.8 2.9A8.3 8.3 0 0 1 2 18.4a11.6 11.6 0 0 0 6.3 1.8c7.5 0 11.6-6.2 11.6-11.6v-.5c.8-.6 1.5-1.3 2.1-2.2Z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12s0-3.2-.4-4.7a2.8 2.8 0 0 0-2-2C17.9 5 12 5 12 5s-5.9 0-7.6.3a2.8 2.8 0 0 0-2 2C2 8.8 2 12 2 12s0 3.2.4 4.7a2.8 2.8 0 0 0 2 2C6.1 19 12 19 12 19s5.9 0 7.6-.3a2.8 2.8 0 0 0 2-2C22 15.2 22 12 22 12Z"/><path d="M10 15.5v-7l6 3.5-6 3.5Z" fill="var(--card)"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'
  };

  /* ---------- Toast helper ---------- */
  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* ---------- Helpers ---------- */
  function escapeHtml(str){
    return String(str || '').replace(/[&<>"']/g, s => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
  }

  function highlightText(text, query){
    if(!query || !text) return escapeHtml(text);
    const escapedText = escapeHtml(text);
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, 'gi');
    return escapedText.replace(regex, '<mark class="highlight">$1</mark>');
  }

  function formatDate(iso){
    if(!iso) return '';
    const d = new Date(iso + "T00:00:00");
    return isNaN(d.getTime()) ? iso : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  /* ---------- Back to Top ---------- */
  window.addEventListener('scroll', () => {
    const winScroll = document.documentElement.scrollTop;
    const btt = document.getElementById('backToTop');
    if(winScroll > 350){ btt.classList.add('show'); } else { btt.classList.remove('show'); }
  });

  document.getElementById('backToTop').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- Bookmarks System ---------- */
  function updateSavedCount(){
    const count = state.savedIds.size;
    document.getElementById('savedChipCount').textContent = count;
    document.getElementById('sidebarSavedCount').textContent = count;
  }

  function toggleSavePost(id, e){
    if(e) e.stopPropagation();
    const strId = String(id);
    if(state.savedIds.has(strId)){
      state.savedIds.delete(strId);
      showToast("Note removed");
    } else {
      state.savedIds.add(strId);
      showToast("Note saved ✨");
    }
    localStorage.setItem('verdant_saved', JSON.stringify([...state.savedIds]));
    updateSavedCount();
    applyFilters();
  }

  /* ---------- Share System ---------- */
  function sharePost(title, url, e){
    if(e) e.stopPropagation();
    const fullUrl = new URL(url, window.location.href).href;
    if(navigator.share){
      navigator.share({ title: title, url: fullUrl }).catch(() => {});
    } else {
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast("Link copied! 📋");
      }).catch(() => {
        showToast("Failed to copy link");
      });
    }
  }

  /* ---------- Render Functions ---------- */
  function renderSite(data){
    if(!data || !data.site) return;
    document.getElementById('siteNameText').textContent = data.site.name;
    document.getElementById('siteTaglineText').textContent = data.site.tagline;
    document.title = data.site.name + " — " + data.site.tagline;
    document.getElementById('siteFooter').innerHTML =
      "© <span id='year'></span> " + escapeHtml(data.site.name) + ". All rights reserved.";
    document.getElementById('year').textContent = new Date().getFullYear();
  }

  function renderAuthor(author){
    if(!author) return;
    document.getElementById('authorPhoto').src = author.photo || '';
    document.getElementById('authorPhoto').alt = author.name || '';
    document.getElementById('authorName').textContent = author.name || '';
    document.getElementById('authorBio').textContent = author.bio || '';
    const wrap = document.getElementById('authorSocials');
    wrap.innerHTML = (author.socials || []).map(s =>
      `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" aria-label="${escapeHtml(s.name)}">${socialIcons[s.icon] || ''}</a>`
    ).join('');
  }

  function renderFooterPages(pages){
    if(!pages) return;
    const el = document.getElementById('sidebarFooter');
    pages.forEach(p => {
      const a = document.createElement('a');
      a.href = p.url;
      a.textContent = p.title;
      el.appendChild(a);
    });
  }

  function renderCategories(posts){
    const counts = {};
    posts.forEach(p => { 
      if(p.category) counts[p.category] = (counts[p.category] || 0) + 1; 
    });
    const cats = Object.keys(counts).sort();
    if(!cats.length) return;

    // Sidebar & Aside Widget
    const list = document.getElementById('categoriesList');
    list.innerHTML = cats.map(c =>
      `<li><a href="#" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</a><span class="count">${counts[c]}</span></li>`
    ).join('');
    document.getElementById('categoriesCard').style.display = 'block';

    const sideLabel = document.getElementById('sidebarCategoriesLabel');
    const sideWrap = document.getElementById('sidebarCategories');
    sideLabel.style.display = 'block';
    sideWrap.innerHTML = cats.map(c =>
      `<a href="#" data-cat="${escapeHtml(c)}"><span>${escapeHtml(c)}</span> <span>${counts[c]}</span></a>`
    ).join('');

    // Quick chips
    const chipsList = document.getElementById('chipsList');
    const savedChip = document.getElementById('savedChip');
    cats.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.dataset.cat = c;
      btn.textContent = `${c} (${counts[c]})`;
      chipsList.insertBefore(btn, savedChip);
    });
  }

  function postCardHtml(post){
    const isSaved = state.savedIds.has(String(post.id || post.url));
    const titleHighlighted = highlightText(post.title, state.query);
    const excerptHighlighted = highlightText(post.excerpt, state.query);

    return `
      <li class="post-card">
        <div class="card-top">
          <div class="post-meta">
            ${post.category ? `<span class="cat-pill" data-cat="${escapeHtml(post.category)}">${escapeHtml(post.category)}</span>` : ''}
            <span>${formatDate(post.date)}</span>
          </div>
          <div class="post-actions">
            <button class="action-btn ${isSaved ? 'saved' : ''}" onclick="window.__toggleSave('${escapeHtml(post.id || post.url)}', event)" aria-label="Bookmark post">
              <svg viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="action-btn" onclick="window.__sharePost('${escapeHtml(post.title)}', '${escapeHtml(post.url)}', event)" aria-label="Share post">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            </button>
          </div>
        </div>
        <h2><a href="${escapeHtml(post.url)}">${titleHighlighted}</a></h2>
        <p>${excerptHighlighted}</p>
      </li>`;
  }

  window.__toggleSave = toggleSavePost;
  window.__sharePost = sharePost;

  function renderNextBatch(){
    const list = document.getElementById('postList');
    const empty = document.getElementById('emptyState');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const next = state.filtered.slice(state.rendered, state.rendered + PAGE_SIZE);

    if(state.rendered === 0){ list.innerHTML = ""; }
    
    if(state.filtered.length === 0){
      empty.style.display = 'block';
      loadMoreWrap.style.display = 'none';
    } else {
      empty.style.display = 'none';
      list.insertAdjacentHTML('beforeend', next.map(postCardHtml).join(''));
    }

    state.rendered += next.length;

    // Load More visibility check
    if(state.rendered < state.filtered.length){
      loadMoreWrap.style.display = 'block';
    } else {
      loadMoreWrap.style.display = 'none';
    }

    // Active chip highlight
    document.querySelectorAll('[data-cat]').forEach(el => {
      el.classList.toggle('active', !state.showSavedOnly && el.dataset.cat === state.selectedCat);
    });
    document.getElementById('savedChip').classList.toggle('active', state.showSavedOnly);
  }

  /* ---------- Filtering & Sorting ---------- */
  function applyFilters(){
    const q = state.query.toLowerCase();

    state.filtered = state.allPosts.filter(p => {
      const isSaved = state.savedIds.has(String(p.id || p.url));
      if(state.showSavedOnly && !isSaved) return false;

      const title = (p.title || '').toLowerCase();
      const excerpt = (p.excerpt || '').toLowerCase();
      const matchesQuery = !q || title.includes(q) || excerpt.includes(q);
      const matchesCat = state.showSavedOnly || !state.selectedCat || state.selectedCat === 'all' || p.category === state.selectedCat;

      return matchesQuery && matchesCat;
    });

    // Sorting
    if(state.sortBy === 'latest'){
      state.filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    } else if(state.sortBy === 'oldest'){
      state.filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
    }

    state.rendered = 0;
    renderNextBatch();
  }

  /* ---------- Search & Clear ---------- */
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');

  let debounceTimer;
  searchInput.addEventListener('input', (e) => {
    const val = e.target.value;
    searchClear.style.display = val ? 'flex' : 'none';
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      state.query = val.trim();
      applyFilters();
    }, 150);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = "";
    state.query = "";
    searchClear.style.display = 'none';
    applyFilters();
    searchInput.focus();
  });

  /* ---------- Event Listeners ---------- */
  document.getElementById('sortSelect').addEventListener('change', (e) => {
    state.sortBy = e.target.value;
    applyFilters();
  });

  document.getElementById('savedChip').addEventListener('click', () => {
    state.showSavedOnly = !state.showSavedOnly;
    applyFilters();
  });

  document.getElementById('sidebarSavedLink').addEventListener('click', (e) => {
    e.preventDefault();
    state.showSavedOnly = true;
    closeSidebar();
    applyFilters();
    window.scrollTo({ top:0, behavior:'smooth' });
  });

  document.addEventListener('click', (e) => {
    const catLink = e.target.closest('[data-cat]');
    if(catLink){
      e.preventDefault();
      state.showSavedOnly = false;
      state.selectedCat = catLink.dataset.cat;
      closeSidebar();
      applyFilters();
      window.scrollTo({ top:0, behavior:'smooth' });
    }
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    searchInput.value = "";
    state.query = "";
    state.selectedCat = "all";
    state.showSavedOnly = false;
    state.sortBy = "latest";
    document.getElementById('sortSelect').value = "latest";
    searchClear.style.display = 'none';
    applyFilters();
  });

  // Load More Button Event
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  loadMoreBtn.addEventListener('click', () => {
    loadMoreBtn.classList.add('loading');
    setTimeout(() => {
      renderNextBatch();
      loadMoreBtn.classList.remove('loading');
    }, 200);
  });

  /* ---------- Sidebar Drawer ---------- */
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.getElementById('menuBtn');

  function openSidebar(){
    sidebar.classList.add('open');
    overlay.classList.add('show');
    menuBtn.classList.add('active');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSidebar(){
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
    menuBtn.classList.remove('active');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', () => {
    sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);

  /* ---------- Initial Load ---------- */
  updateSavedCount();

  fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
    .then(res => {
      if(!res.ok) throw new Error('Network error');
      return res.json();
    })
    .then(data => {
      const rawPosts = Array.isArray(data) ? data : (data.posts || []);

      const sortedPosts = [...rawPosts].sort((a, b) => {
        if (a.id && b.id) return b.id - a.id;
        return new Date(b.date) - new Date(a.date);
      });

      renderSite(data);
      renderAuthor(data.author);
      renderFooterPages(data.pages);
      renderCategories(sortedPosts);

      state.allPosts = sortedPosts;
      applyFilters();
    })
    .catch(err => {
      document.getElementById('postList').innerHTML =
        `<li class="empty-state" style="display:block;">
          Failed to load <code>data.json</code>. Please run a local server (e.g. <code>python3 -m http.server</code>).
        </li>`;
      console.error(err);
    });
})();
</script>
</body>
</html>
